<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eureach Operations</title><meta name="description" content="Configuration-driven outreach operations console"><style>
:root{font-family:Inter,system-ui,sans-serif;color:#201e19;background:#e9ebe2}*{box-sizing:border-box}body{margin:0}.shell{max-width:1200px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bbb;padding-bottom:16px}.brand{font-size:22px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card{background:#fff;border:1px solid #d1d2ca;padding:18px;border-radius:6px}.metric{font-size:28px;font-weight:800}.muted{color:#666}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #bbb;border-radius:4px}button{cursor:pointer;background:#201e19;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#eee}.login{max-width:420px;margin:10vh auto}.hidden{display:none}@media(max-width:800px){.grid,.layout{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:520px){.grid,.row{grid-template-columns:1fr}}
</style></head><body><main class="shell">
<section id="login" class="login card"><h1>Eureach</h1><p class="muted">Sign in to your outreach operation.</p><div class="field"><label>Tenant</label><input id="tenant" value="demo" autocomplete="organization"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">Sign in</button><p id="loginError" class="muted"></p></section>
<section id="app" class="hidden"><header class="bar"><div><div class="brand">Eureach</div><div id="tenantName" class="muted"></div></div><button id="logout">Sign out</button></header><div class="grid"><div class="card"><div id="recordsLabel" class="muted">Records</div><div id="recordsMetric" class="metric">—</div></div><div class="card"><div id="pendingLabel" class="muted">Pending</div><div id="pendingMetric" class="metric">—</div></div><div class="card"><div id="reachLabel" class="muted">Reach rate</div><div id="reachMetric" class="metric">—</div></div><div class="card"><div id="campaignLabel" class="muted">Campaigns</div><div id="campaignMetric" class="metric">—</div></div></div>
<div class="layout"><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 id="recordHeading">Records</h2><p id="recordHint" class="muted">Configuration-aware operational records.</p></div><button id="newRecord">New record</button></div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Name</th><th>Status</th><th>Updated</th></tr></thead><tbody id="recordsBody"></tbody></table></div></section>
<section class="card"><h2 id="formHeading">Create record</h2><form id="recordForm"></form><button id="saveRecord">Create</button><p id="formError" class="muted"></p></section></div></section></main>
<script>
let accessToken=null,config=null;const $=id=>document.getElementById(id);const api=async(path,options={})=>{let r=await fetch(path,{...options,headers:{'content-type':'application/json',...(options.headers||{}),...(accessToken?{authorization:'Bearer '+accessToken}:{})},credentials:'include'});if(r.status===401&&path!='/api/v1/auth/refresh'){const rr=await fetch('/api/v1/auth/refresh',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:'{}'});if(rr.ok){accessToken=(await rr.json()).accessToken;r=await fetch(path,{...options,headers:{'content-type':'application/json',...(options.headers||{}),authorization:'Bearer '+accessToken},credentials:'include'})}}if(!r.ok)throw new Error((await r.json()).error?.message||'Request failed');return r.status===204?null:r.json()};
async function load(){const c=await api('/api/v1/config');config=c.configuration;$('tenantName').textContent=c.tenant.name+' · '+config.displayName;$('recordsLabel').textContent=config.dashboardLabels.records;$('pendingLabel').textContent=config.dashboardLabels.pending;$('reachLabel').textContent=config.dashboardLabels.reachRate;$('campaignLabel').textContent=config.dashboardLabels.campaigns;$('recordHeading').textContent=config.recordTypePlural;$('formHeading').textContent='Create '+config.recordType;renderForm();await Promise.all([dashboard(),records()])}
async function dashboard(){const d=await api('/api/v1/dashboard');$('recordsMetric').textContent=d.metrics.totalRecords;$('pendingMetric').textContent=d.metrics.pending;$('reachMetric').textContent=d.metrics.reachRate+'%';$('campaignMetric').textContent=d.metrics.campaigns}
async function records(){const d=await api('/api/v1/records');$('recordsBody').innerHTML=d.data.map(r=>{const f=r.custom_fields||{};return `<tr><td>${esc(f[config.fieldDefinitions[0].key]||r.id)}</td><td><span class="pill">${esc(r.status)}</span></td><td>${new Date(r.updated_at).toLocaleString()}</td></tr>`}).join('')||'<tr><td colspan="3" class="muted">No records yet.</td></tr>'}
function renderForm(){$('recordForm').innerHTML=config.fieldDefinitions.map(f=>`<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label>${f.type==='select'?`<select data-key="${esc(f.key)}"><option value="">Select…</option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input data-key="${esc(f.key)}" type="${f.type==='number'?'number':f.type==='email'?'email':f.type==='date'?'date':'text'}" ${f.required?'required':''}>`}</div>`).join('')}
$('saveRecord').onclick=async()=>{try{const customFields={};document.querySelectorAll('#recordForm [data-key]').forEach(el=>{if(el.value!=='')customFields[el.dataset.key]=el.type==='number'?Number(el.value):el.value});await api('/api/v1/records',{method:'POST',body:JSON.stringify({customFields})});$('formError').textContent='Created.';$('recordForm').reset();await Promise.all([dashboard(),records()])}catch(e){$('formError').textContent=e.message}}
$('loginBtn').onclick=async()=>{try{const r=await fetch('/api/v1/auth/login',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({tenantSlug:$('tenant').value,email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'Sign in failed');accessToken=d.accessToken;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginError').textContent=e.message}}
$('logout').onclick=async()=>{try{await fetch('/api/v1/auth/logout',{method:'POST',credentials:'include'})}finally{accessToken=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}};$('newRecord').onclick=()=>$('formHeading').scrollIntoView({behavior:'smooth'});function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
