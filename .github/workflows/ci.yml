name: Eureach CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eureach
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eureach"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eureach
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests-123456
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: node --check server/app.mjs
      - run: node --check server/security.mjs
      - run: node --check scripts/migrate.mjs
      - name: Dependency vulnerability scan (production deps only)
        run: npm audit --omit=dev --audit-level=high
      - name: Apply clean schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/001_core_schema.sql
        env:
          PGPASSWORD: postgres
      - name: Create runtime role
        run: bash database/002_runtime_role.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: eureach
          POSTGRES_APP_PASSWORD: ci-only-app-password-123
      - name: Apply launch-hardening migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/003_launch_hardening.sql
        env:
          PGPASSWORD: postgres
      - name: Prove tenant RLS isolation (real Postgres, real restricted role, adversarial queries)
        run: node --test tests/rls-isolation.test.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eureach
          APP_DATABASE_URL: postgresql://eureach_app:ci-only-app-password-123@localhost:5432/eureach
      - name: Prove authorization matrix (every permission, real HTTP API)
        run: node --test tests/authorization-matrix.test.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eureach
          APP_DATABASE_URL: postgresql://eureach_app:ci-only-app-password-123@localhost:5432/eureach
      - run: npm run test:security
      - name: Validate upgrade migration (legacy schema -> 002 -> 003, in sequence)
        run: |
          dropdb --if-exists --host=localhost --username=postgres eureach_upgrade
          createdb --host=localhost --username=postgres eureach_upgrade
          psql postgresql://postgres:postgres@localhost:5432/eureach_upgrade -v ON_ERROR_STOP=1 -f database/legacy-v1.1.sql
          psql postgresql://postgres:postgres@localhost:5432/eureach_upgrade -v ON_ERROR_STOP=1 -f database/migrations/002_production_security.sql
          psql postgresql://postgres:postgres@localhost:5432/eureach_upgrade -v ON_ERROR_STOP=1 -f database/migrations/003_launch_hardening.sql
        env:
          PGPASSWORD: postgres
      - name: Disaster-recovery drill (backup -> destroy -> restore -> integrity check)
        run: sh scripts/dr-drill.sh
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eureach
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: eureach

  container-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build image
        run: docker build -t eureach:ci .
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: eureach:ci
          severity: HIGH,CRITICAL
          # Report-only until a first baseline run has been reviewed and
          # any findings triaged; flip to `exit-code: '1'` once that
          # baseline exists so future regressions actually fail CI.
          exit-code: '0'
          format: table
